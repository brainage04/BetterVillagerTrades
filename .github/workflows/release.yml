name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  distribution:
    permissions:
      contents: write
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-multiloader-release.yml@v3.5.0
    with:
      # brainagelib-gametest is not on Maven Central, so the build compiles it from this BrainageLib
      # commit (release/2.0.0). Switch to BrainageLib@v2.0.0 once that tag exists, and move the pin
      # together with brainagelib_version in gradle.properties.
      prepare_siblings: BrainageLib@d783aa0a761aa6523fbf3ed291d7b5ca288fbffc
      additional_artifact_pattern: bettervillagertrades-neoforge-*.jar
      release_name: ${{ format('BetterVillagerTrades {0}', github.ref_name) }}
      modrinth_project_id: ${{ vars.MODRINTH_PROJECT_ID }}
      curseforge_project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
      curseforge_project_slug: better-villager-trades
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
      modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
      curseforge_token: ${{ secrets.CURSEFORGE_TOKEN }}
